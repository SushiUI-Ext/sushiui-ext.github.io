<thead><tr><th>Device</th><th>Vendor</th><th>Model</th><th>Kernel</th><th>Version</th><th>Channel</th><th>Derived from</th><th>Maintainers</th><th>Source</th></tr></thead>

<script type="text/plain" id="fallback">

<script>
(function(){
var URL_SUSIN="https://raw.githubusercontent.com/SushiUI-Ext/sushin/refs/heads/main/index.susin";
var BASE=URL_SUSIN.slice(0,URL_SUSIN.lastIndexOf("/")+1);

/* maintainer photos and profiles (photos.json, same folder as this page) */
var photos={maintainers:{},fallback:""};
function loadPhotos(){
  return fetch("photos.json?t="+Date.now())
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){if(j&&j.maintainers)photos=j;})
    .catch(function(){});
}

/* tolerant parser: never throws, skips anything it cannot read */
function parse(txt){
  var out=[],cur=null,bad=0;
  String(txt==null?"":txt).replace(/^\uFEFF/,"").split(/\r?\n/).forEach(function(raw){
    var line=raw.trim();
    if(!line||line.charAt(0)==="#"||line.charAt(0)===";")return;
    if(line.charAt(0)==="["){
      var name=line.replace(/^\[/,"").replace(/\]?\s*$/,"").trim();
      if(name){cur={name:name};out.push(cur);}else{bad++;}
      return;
    }
    var m=line.match(/^([A-Za-z0-9_]+)\s*[=:]\s*(.*)$/);
    if(m&&cur){cur[m[1].toLowerCase()]=m[2].trim();return;}
    bad++;
  });
  return {list:out,bad:bad};
}

/* image from https link or relative path (tries the sushin repo first, then this site) */
function img(v,cls,alt,local){
  if(!v||v==="null")return null;
  var srcs;
  if(/^https:\/\//i.test(v)){srcs=[v];}
  else if(!/^[a-z][a-z0-9+.-]*:/i.test(v)&&v.indexOf("..")<0){v=v.replace(/^\.?\/+/,"");srcs=local?[v]:[BASE+v,v];}
  else{return null;}
  var el=document.createElement("img");
  el.className=cls;el.alt=alt;el.loading="lazy";
  var i=0;
  el.onerror=function(){i++;if(i<srcs.length){el.src=srcs[i];}else{el.style.display="none";}};
  el.src=srcs[0];
  return el;
}

function cell(tr,text){var td=document.createElement("td");td.textContent=text;tr.appendChild(td);return td;}

function row(d){
  var tr=document.createElement("tr");
  var n=cell(tr,"");
  var w=document.createElement("div");w.className="who";
  var ph=img(d.photo,"thumb",d.name);
  if(ph)w.appendChild(ph);
  var b=document.createElement("b");b.textContent=d.name;w.appendChild(b);
  n.appendChild(w);
  cell(tr,d.vendor_display||d.vendor||"");
  cell(tr,d.device||"");
  cell(tr,d.kernel||"");
  cell(tr,d.sushi_version||"");
  cell(tr,d.sushi_channel||"").className="tag";
  var dv=d.deriv_from;
  cell(tr,(!dv||dv==="null")?"\u2014":dv);
  var m=cell(tr,"");
  var names=(d.maintainer||"").split(/\s+/).filter(function(x){return x&&x!=="null";});
  names.forEach(function(nm,i){
    var s=document.createElement("span");s.className="mt";
    var p=photos.maintainers[nm];
    var a=(p&&p.photo)?img(p.photo,"av",nm,true):img(d["maintainer"+(i+1)+"_photo"],"av",nm);
    if(!a&&photos.fallback)a=img(photos.fallback,"av",nm,true);
    if(a)s.appendChild(a);
    if(p&&p.github){
      var l=document.createElement("a");
      l.href="https://github.com/"+encodeURIComponent(p.github);
      l.textContent=nm;s.appendChild(l);
    }else{s.appendChild(document.createTextNode(nm));}
    m.appendChild(s);
  });
  var s2=cell(tr,"");
  if(d.source_code&&/^https:\/\//i.test(d.source_code)){
    var a2=document.createElement("a");a2.href=d.source_code;a2.textContent="[git]";s2.appendChild(a2);
  }
  return tr;
}

function render(res,note){
  var tb=document.querySelector("#devices tbody");tb.textContent="";
  var skipped=0;
  res.list.forEach(function(d){
    try{tb.appendChild(row(d));}catch(e){skipped++;}
  });
  var extra=res.bad+skipped;
  document.getElementById("status").textContent=note+(extra?" ("+extra+" unreadable line"+(extra>1?"s":"")+" ignored.)":"");
}

var fb=parse(document.getElementById("fallback").textContent);
var why="";
loadPhotos().then(function(){return fetch(URL_SUSIN+"?t="+Date.now());})
.then(function(r){if(!r.ok){why="HTTP "+r.status;throw 0;}return r.text();})
.then(function(t){var res=parse(t);if(!res.list.length){why="no readable devices in the file";throw 0;}render(res,"Loaded from index.susin (sushin repository).");})
.catch(function(e){if(!why)why=(e&&e.message)?e.message:"network or CORS error";render(fb,"Could not read index.susin ("+why+"), showing the built-in copy of the list.");});
})();
</script>
</body>
