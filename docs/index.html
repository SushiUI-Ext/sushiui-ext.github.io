<script>
(function(){
var URL_JSONC="https://raw.githubusercontent.com/SushiUI-Ext/releases/refs/heads/releases/devices.jsonc";
var URL_TREE="https://github.com/SushiUI-Ext/releases/tree/releases/";

/* parser 2 (JSONC): removes comments and trailing commas, never touches text inside strings */
function stripJsonc(txt){
  var out=[],i=0,n=txt.length,inStr=false,lastComma=-1,c,d,e;
  while(i<n){
    c=txt.charAt(i);d=txt.charAt(i+1);
    if(inStr){
      out.push(c);
      if(c==="\\"){out.push(d);i+=2;continue;}
      if(c==='"')inStr=false;
      i++;continue;
    }
    if(c==="/"&&d==="/"){while(i<n&&txt.charAt(i)!=="\n")i++;continue;}
    if(c==="/"&&d==="*"){e=txt.indexOf("*/",i+2);i=(e<0)?n:e+2;out.push(" ");continue;}
    if(c==='"'){inStr=true;lastComma=-1;out.push(c);i++;continue;}
    if(c===","){lastComma=out.length;out.push(c);i++;continue;}
    if(c==="]"||c==="}"){if(lastComma>=0)out[lastComma]="";lastComma=-1;out.push(c);i++;continue;}
    if(!/\s/.test(c))lastComma=-1;
    out.push(c);i++;
  }
  return out.join("");
}

/* parser 1 (plain JSON) first; if it fails, parser 2 (JSONC). throws if both fail */
function parseDevices(txt){
  txt=String(txt==null?"":txt).replace(/^\uFEFF/,"");
  var data;
  try{data=JSON.parse(txt);}
  catch(e1){data=JSON.parse(stripJsonc(txt));}
  var arr=Array.isArray(data)?data:(data&&Array.isArray(data.devices)?data.devices:null);
  if(!arr)throw new Error("unexpected structure");
  var list=[],bad=0;
  arr.forEach(function(d){
    if(d&&typeof d==="object"&&!Array.isArray(d)&&d.codename)list.push(d);else bad++;
  });
  return {list:list,bad:bad};
}

/* maintainer: string or array, separated by spaces or commas */
function names(v){
  var out=[];
  [].concat(v==null?[]:v).forEach(function(x){
    String(x).split(/[\s,]+/).forEach(function(nm){if(nm&&nm!=="null")out.push(nm);});
  });
  return out;
}
/*--dom--*/

/* photos.json (same folder as this page): maintainer photo + github */
var photos={maintainers:{},fallback:""};
function loadPhotos(){
  return fetch("photos.json?t="+Date.now())
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){if(j&&j.maintainers)photos=j;})
    .catch(function(){});
}

function okSrc(v){
  if(!v||typeof v!=="string"||v==="null")return null;
  if(/^https:\/\//i.test(v))return v;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(v)&&v.indexOf("..")<0)return v.replace(/^\.?\/+/,"");
  return null;
}
function img(list,cls,alt){
  var srcs=list.map(okSrc).filter(Boolean);
  if(!srcs.length)return null;
  var el=document.createElement("img");
  el.className=cls;el.alt=alt;el.loading="lazy";
  var i=0;
  el.onerror=function(){i++;if(i<srcs.length){el.src=srcs[i];}else{el.style.display="none";}};
  el.src=srcs[0];
  return el;
}

function cell(tr,text){var td=document.createElement("td");td.textContent=text;tr.appendChild(td);return td;}
function link(href,text){var a=document.createElement("a");a.href=href;a.textContent=text;return a;}
function vendorName(v){v=String(v||"");return v?v.charAt(0).toUpperCase()+v.slice(1):"";}
function ghUrl(u){
  u=String(u||"");
  if(/^https:\/\/github\.com\//i.test(u))return u;
  if(/^github\.com\//i.test(u))return "https://"+u;
  return null;
}

function row(d){
  var tr=document.createElement("tr");
  var n=cell(tr,"");
  var b=document.createElement("b");b.textContent=String(d.codename);n.appendChild(b);
  cell(tr,vendorName(d.vendor));
  cell(tr,d.device||"");
  var st=cell(tr,d.dropped?"Dropped":"Active");
  st.className=d.dropped?"tag muted":"tag";
  var m=cell(tr,"");
  names(d.maintainer).forEach(function(nm){
    var s=document.createElement("span");s.className="mt";
    var p=photos.maintainers[nm];
    var a=img([p&&p.photo,photos.fallback],"av",nm);
    if(a)s.appendChild(a);
    if(p&&p.github){s.appendChild(link("https://github.com/"+encodeURIComponent(p.github),nm));}
    else{s.appendChild(document.createTextNode(nm));}
    m.appendChild(s);
  });
  var dl=cell(tr,"");
  var folder=String(d.downloads_folder||"");
  if(d.releases&&folder&&folder.indexOf("..")<0&&!/^[a-z][a-z0-9+.-]*:/i.test(folder)){
    dl.appendChild(link(URL_TREE+encodeURI(folder.replace(/^\/+/,"")),"[releases]"));
  }else{dl.textContent="\u2014";}
  var s2=cell(tr,"");
  var src=ghUrl(d.source);
  if(src)s2.appendChild(link(src,"[git]"));
  return tr;
}

function render(res,note){
  var tb=document.querySelector("#devices tbody");tb.textContent="";
  var skipped=0;
  res.list.forEach(function(d){
    try{tb.appendChild(row(d));}catch(e){skipped++;}
  });
  var extra=res.bad+skipped;
  document.getElementById("status").textContent=note+(extra?" ("+extra+" unreadable entr"+(extra>1?"ies":"y")+" ignored.)":"");
}

var fb;
try{fb=parseDevices(document.getElementById("fallback").textContent);}catch(e){fb={list:[],bad:0};}
var why="";
loadPhotos().then(function(){return fetch(URL_JSONC+"?t="+Date.now());})
.then(function(r){if(!r.ok){why="HTTP "+r.status;throw 0;}return r.text();})
.then(function(t){var res=parseDevices(t);if(!res.list.length){why="no readable devices in the file";throw 0;}render(res,"Loaded from devices.jsonc (releases repository).");})
.catch(function(e){if(!why)why=(e&&e.message)?e.message:"network or CORS error";render(fb,"Could not read devices.jsonc ("+why+"), showing the built-in copy of the list.");});
})();
</script>
